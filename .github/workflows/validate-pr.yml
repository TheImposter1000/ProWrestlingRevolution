name: Validate Windows title screen

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate separate PRWEditor MDB and native schema manifest
        shell: pwsh
        run: |
          python Tools/EditorMdbGenerator/build_editor_manifest.py
          if ($LASTEXITCODE -ne 0) { throw "Editor metadata manifest generation failed" }
          mvn -q -f Tools/EditorMdbGenerator/pom.xml compile exec:java
          if ($LASTEXITCODE -ne 0) { throw "PRWEditor MDB generation failed" }
          if (-not (Test-Path "System/PRWEditor.mdb")) { throw "Missing editor metadata MDB" }
      - name: Build Windows Forms game
        run: dotnet build ProWrestlingRevolution.csproj -c Release
      - name: Run application smoke tests and capture worker previews
        shell: pwsh
        run: |
          $env:PWR_WORKER_PREVIEW = Join-Path $PWD "worker-editor-preview.png"
          dotnet run --project ProWrestlingRevolution.csproj -c Release -- --smoke
          if ($LASTEXITCODE -ne 0) { throw "Worker/Skills smoke tests failed" }

      - name: Upload Worker Editor and Skills visual previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Worker-Editor-Draft-Visuals
          path: |
            worker-editor-preview.png
            worker-skills-preview.png
            worker-skills-compact-preview.png
            worker-skills-header-preview.png
            worker-skills-composed-header-preview.png
            pwr-header-worker.png
            pwr-header-skills.png
            pwr-header-contracts.png
            pwr-header-popularity.png
            pwr-header-business-skills.png
            pwr-header-database.png
          if-no-files-found: warn
          retention-days: 30
      - name: Verify published runtime paths and base template
        shell: pwsh
        run: |
          dotnet publish ProWrestlingRevolution.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -o publish
          if ($LASTEXITCODE -ne 0) { throw "Publish failed" }
          # WinExe launches asynchronously under PowerShell; explicitly wait.
          $initialized = Start-Process -FilePath (Resolve-Path "publish/ProWrestlingRevolution.exe") -ArgumentList "--generate-assets" -Wait -PassThru
          if ($initialized.ExitCode -ne 0) { throw "Runtime initialization failed: $($initialized.ExitCode)" }
          foreach ($item in @("publish/System/PRWDefault.mdb",
                              "publish/Skins/Obsidian/Backgrounds/Title_Screen.jpg",
                              "publish/Skins/Steel/Backgrounds/Title_Screen.jpg")) {
            if (-not (Test-Path $item)) { throw "Missing installed application data: $item" }
          }
          if (Test-Path "System/PRWDefault.mdb") { throw "Template was incorrectly installed in source repository" }
          if (-not (Test-Path "publish/System/PRWEditor.mdb")) { throw "Editor metadata database is missing from publish output" }
          if ((Get-Item "publish/System/PRWEditor.mdb").Length -lt 4096) { throw "Editor metadata MDB is unexpectedly short" }
          if ((Get-Item "publish/System/PRWDefault.mdb").Length -ne 434176) { throw "Replacement template length is incorrect" }
          if ((Get-FileHash "publish/System/PRWDefault.mdb" -Algorithm SHA256).Hash -ne "E59C723D3919DA1A9BB6927FEA27D712FEAA17815735AE29FAA23B5087267A38") {
            throw "Published replacement template is not the uploaded MDB"
          }

      - name: Run real packaged Windows EXE smoke tests
        shell: pwsh
        run: |
          $exe = (Resolve-Path "publish/ProWrestlingRevolution.exe").Path
          $verify = Start-Process -FilePath $exe -ArgumentList "--smoke" -PassThru -Wait
          if ($verify.ExitCode -ne 0) { throw "Standalone Windows EXE failed smoke tests: $($verify.ExitCode)" }

      - name: Inspect native PRW field types and sample values
        shell: pwsh
        run: |
          mvn -q -f Tools/EditorMdbGenerator/pom.xml exec:java "-Dpwr.mainClass=PrwDefaultInspector" "-Dexec.args=publish/System/PRWDefault.mdb"
          if ($LASTEXITCODE -ne 0) { throw "Native MDB field inspection failed" }

      - name: Upload standalone Windows test EXE
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PWR-Unreleased-Worker-Skills-Draft
          path: publish/ProWrestlingRevolution.exe
          if-no-files-found: error
          retention-days: 30
