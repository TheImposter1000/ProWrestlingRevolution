name: Build and Release Windows Game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Java for independent Jet MDB generation
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build dedicated PRW editor metadata MDB
        shell: pwsh
        run: |
          python Tools/EditorMdbGenerator/build_editor_manifest.py
          if ($LASTEXITCODE -ne 0) { throw "Editor manifest generation failed" }
          mvn -q -f Tools/EditorMdbGenerator/pom.xml compile exec:java
          if ($LASTEXITCODE -ne 0) { throw "PRWEditor.mdb generation failed" }
          if (-not (Test-Path "System/PRWEditor.mdb")) { throw "Generated MDB not found" }

      - name: Verify the menu, skins, folder layout and MDB file-management routines
        shell: pwsh
        run: |
          $env:PWR_WORKER_PREVIEW = Join-Path $PWD "worker-editor-preview.png"
          dotnet run --project ProWrestlingRevolution.csproj -c Release -- --smoke
          if ($LASTEXITCODE -ne 0) { throw "Version 0.6.5 smoke test failed: $LASTEXITCODE" }

      - name: Upload Worker Editor and Skills visual verification previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Worker-Editor-and-Skills-Visual-Previews
          path: |
            worker-editor-preview.png
            worker-skills-preview.png
            worker-skills-compact-preview.png
            worker-skills-header-preview.png
          if-no-files-found: warn

      - name: Build a self-contained Windows x64 desktop executable
        shell: pwsh
        run: |
          dotnet publish ProWrestlingRevolution.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -o publish
          if ($LASTEXITCODE -ne 0) { throw "Windows build failed" }

      - name: Run real packaged Windows EXE smoke tests
        shell: pwsh
        run: |
          $exe = (Resolve-Path "publish/ProWrestlingRevolution.exe").Path
          $verify = Start-Process -FilePath $exe -ArgumentList "--smoke" -PassThru -Wait
          if ($verify.ExitCode -ne 0) { throw "Standalone Windows EXE failed smoke tests: $($verify.ExitCode)" }

      - name: Generate assets in the published application directory
        shell: pwsh
        run: |
          # WinExe launches asynchronously under PowerShell; explicitly wait.
          $initialized = Start-Process -FilePath (Resolve-Path "publish/ProWrestlingRevolution.exe") -ArgumentList "--generate-assets" -Wait -PassThru
          if ($initialized.ExitCode -ne 0) { throw "Runtime asset generation failed: $($initialized.ExitCode)" }
          foreach ($skin in @("Obsidian", "Steel")) {
            foreach ($category in @("Backgrounds","Buttons","Graphics","Loading_NoProfile","Loading_Profile","LowerBars","SideBars","TopBars")) {
              if (-not (Test-Path ("publish/Skins/" + $skin + "/" + $category))) { throw "Missing published skin category: $skin/$category" }
            }
            foreach ($file in @("Backgrounds/Title_Screen.jpg", "SideBars/Title_Screen.jpg",
                                "SideBars/Title_Screen_Alt.jpg", "TopBars/Title_Screen_On.jpg",
                                "TopBars/Title_Screen_Off.jpg", "LowerBars/Title_Screen.jpg")) {
              if (-not (Test-Path ("publish/Skins/" + $skin + "/" + $file))) { throw "Missing published skin: $skin/$file" }
            }
          }
          if (-not (Test-Path "publish/System/PRWEditor.mdb")) { throw "Editor metadata MDB was not bundled" }
          if ((Get-Item "publish/System/PRWEditor.mdb").Length -lt 4096) { throw "Editor metadata MDB too small" }
          if (-not (Test-Path "publish/System/PRWDefault.mdb")) { throw "Local default template was not installed" }
          if ((Get-Item "publish/System/PRWDefault.mdb").Length -ne 434176) { throw "Default template size is incorrect" }
          if ((Get-FileHash "publish/System/PRWDefault.mdb" -Algorithm SHA256).Hash -ne "E59C723D3919DA1A9BB6927FEA27D712FEAA17815735AE29FAA23B5087267A38") {
            throw "Bundled default template checksum did not match PRWDefault.mdb"
          }

      - name: Verify native MDB field types
        shell: pwsh
        run: |
          mvn -q -f Tools/EditorMdbGenerator/pom.xml exec:java "-Dpwr.mainClass=PrwDefaultInspector" "-Dexec.args=publish/System/PRWDefault.mdb"
          if ($LASTEXITCODE -ne 0) { throw "Native MDB schema verification failed" }

      - name: Assemble the Version 0.6.5 complete game ZIP
        shell: pwsh
        run: |
          foreach ($folder in @("Databases", "Pictures", "Skins", "System")) {
            if (-not (Test-Path ("publish/" + $folder))) {
              Copy-Item $folder ("publish/" + $folder) -Recurse -Force
            }
          }
          if (-not (Test-Path "publish/ProWrestlingRevolution.exe")) { throw "Executable missing" }
          if (-not (Test-Path "publish/Skins/Obsidian/SideBars/Title_Screen.jpg")) { throw "Obsidian sidebar missing" }
          if (-not (Test-Path "publish/Skins/Steel/Backgrounds/Title_Screen.jpg")) { throw "Steel title art missing" }
          if (-not (Test-Path "publish/Databases/README.txt")) { throw "Databases folder missing" }
          if (Test-Path "publish/Data/Scenarios/Genesis.json") { throw "Legacy JSON scenario accidentally included" }
          Get-ChildItem publish -Filter *.pdb | Remove-Item -Force
          # This is the COMPLETE game package. Keep its historical ZIP filename
          # so pre-0.5.20 updaters can still extract ONLY the EXE automatically.
          Compress-Archive -Path "publish/*" -DestinationPath "ProWrestlingRevolution-Windows-x64.zip" -Force
          if (-not (Test-Path "ProWrestlingRevolution-Windows-x64.zip")) { throw "ZIP not produced" }

      - name: Verify direct EXE update matches the complete game
        shell: pwsh
        run: |
          Copy-Item "publish/ProWrestlingRevolution.exe" "ProWrestlingRevolution.exe" -Force
          if (-not (Test-Path "ProWrestlingRevolution.exe")) { throw "Standalone EXE missing" }
          if ((Get-Item "ProWrestlingRevolution.exe").VersionInfo.FileVersion -ne "0.6.5.0") {
            throw "Standalone EXE file version does not match this release"
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead("ProWrestlingRevolution-Windows-x64.zip")
          $extracted = "pwr-verify-complete-exe.exe"
          try {
            $entry = $archive.GetEntry("ProWrestlingRevolution.exe")
            if ($null -eq $entry) { throw "Complete game ZIP is missing the application EXE" }
            [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $extracted)
            $zipHash = (Get-FileHash $extracted -Algorithm SHA256).Hash
            $exeHash = (Get-FileHash "ProWrestlingRevolution.exe" -Algorithm SHA256).Hash
            if ($zipHash -ne $exeHash) { throw "Standalone EXE differs from complete game EXE" }
          }
          finally {
            $archive.Dispose()
            Remove-Item $extracted -ErrorAction SilentlyContinue
          }

      - name: Upload standalone update EXE and complete game ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ProWrestlingRevolution-Release
          path: |
            ProWrestlingRevolution.exe
            ProWrestlingRevolution-Windows-x64.zip
          retention-days: 90

      - name: Publish standalone EXE update and complete game
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.6.5
          name: Pro Wrestling Revolution 0.6.5 - Unified Skills Header and Background Rendering
          target_commitish: main
          prerelease: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          body: |
            PWR v0.6.5 addresses two verified defects in the v0.6.4
            Worker and Skills interface.

            SKILLS HEADER
            The PWR title plaque and all four top-right utility controls
            now share one unified full-width blue-metal background and
            a continuous cyan baseline, instead of four dark utility tiles
            appended to a separate gradient. The Help question mark has
            been redrawn as a vector so it stays centered inside its circle
            in both header heights. The original PWR branding, Skills
            title, functional window buttons, and layout are preserved.

            WORKER PAGE RENDERING
            Actual visible-window smoke tests revealed that the previous
            offscreen "1 ms cached tab" benchmark missed expensive GDI+
            background resampling. Background images are now resized once
            to the real page dimensions, reused across workers, painted
            with fast one-to-one tiling, and copied directly rather than
            resampled for each text field and content panel.

            On Windows CI with a synthetic profile, repeated visible
            rendering improved from about 2202 ms to 531 ms for General,
            from 1196 ms to 450 ms for Skills, and from 446 ms to 126 ms
            for Contracts. These are automated test-environment samples,
            not guaranteed timings for individual PCs or large universes.
            The visuals remained pixel-identical in the regression
            screenshot comparison, and Windows builds and packaged EXE
            smoke tests passed.

            LOCAL DIAGNOSTICS
            A bounded, local-only System/Logs/PWR-performance.log records
            slow database connection/schema/table operations, total worker
            profile load, individual tab switches and background rendering.
            It never logs wrestler names, record IDs or database values,
            and never sends data to the internet. This allows remaining
            delays on a user's PC to be identified rather than guessed.

            INSTALLATION
            Check for Updates replaces only ProWrestlingRevolution.exe.
            No changes to the native MDB schema, universe data, save games,
            pictures, skins or game settings. A separate full-game ZIP
            remains available for fresh installations. Live MDB writes
            require Microsoft ACE OLE DB, unavailable in hosted CI.
          files: |
            ProWrestlingRevolution.exe
            ProWrestlingRevolution-Windows-x64.zip
