name: Title Screen Reference Validation

on:
  pull_request:
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '.github/workflows/title-reference-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile Windows Forms application
        run: dotnet build ProWrestlingRevolution.csproj -c Release
      - name: Validate reference layout and skin fallback
        run: dotnet run --project ProWrestlingRevolution.csproj -c Release --no-build -- --smoke
