name: Build and Release Windows Game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify the menu, skins, folder layout and MDB file-management routines
        shell: pwsh
        run: |
          dotnet run --project ProWrestlingRevolution.csproj -c Release -- --smoke
          if ($LASTEXITCODE -ne 0) { throw "Version 0.5.2 smoke test failed: $LASTEXITCODE" }

      - name: Generate original raster image packs at their exact reference sizes
        shell: pwsh
        run: |
          dotnet run --project ProWrestlingRevolution.csproj -c Release -- --generate-assets
          if ($LASTEXITCODE -ne 0) { throw "Skin asset generation failed" }
          foreach ($skin in @("Obsidian", "Steel")) {
            foreach ($category in @("Backgrounds","Buttons","Graphics","Loading_NoProfile","Loading_Profile","LowerBars","SideBars","TopBars")) {
              if (-not (Test-Path ("Skins/" + $skin + "/" + $category))) { throw "Missing skin category: $skin/$category" }
            }
            foreach ($file in @("Backgrounds/Title_Screen.jpg", "SideBars/Title_Screen.jpg",
                                "SideBars/Title_Screen_Alt.jpg", "TopBars/Title_Screen_On.jpg",
                                "TopBars/Title_Screen_Off.jpg", "LowerBars/Title_Screen.jpg")) {
              if (-not (Test-Path ("Skins/" + $skin + "/" + $file))) { throw "Missing image: $skin/$file" }
            }
          }

      - name: Build a self-contained Windows x64 desktop executable
        shell: pwsh
        run: |
          dotnet publish ProWrestlingRevolution.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -o publish
          if ($LASTEXITCODE -ne 0) { throw "Windows build failed" }

      - name: Assemble the Version 0.5.2 portable game ZIP
        shell: pwsh
        run: |
          foreach ($folder in @("Databases", "Pictures", "Skins", "System")) {
            if (-not (Test-Path ("publish/" + $folder))) {
              Copy-Item $folder ("publish/" + $folder) -Recurse -Force
            }
          }
          if (-not (Test-Path "publish/ProWrestlingRevolution.exe")) { throw "Executable missing" }
          if (-not (Test-Path "publish/Skins/Obsidian/SideBars/Title_Screen.jpg")) { throw "Obsidian sidebar missing" }
          if (-not (Test-Path "publish/Skins/Steel/Backgrounds/Title_Screen.jpg")) { throw "Steel title art missing" }
          if (-not (Test-Path "publish/Databases/README.txt")) { throw "Databases folder missing" }
          if (Test-Path "publish/Data/Scenarios/Genesis.json") { throw "Legacy JSON scenario accidentally included" }
          Get-ChildItem publish -Filter *.pdb | Remove-Item -Force
          Compress-Archive -Path "publish/*" -DestinationPath "ProWrestlingRevolution-Windows-x64.zip" -Force
          if (-not (Test-Path "ProWrestlingRevolution-Windows-x64.zip")) { throw "ZIP not produced" }

      - name: Upload complete Version 0.5.2 game ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ProWrestlingRevolution-Windows-x64
          path: ProWrestlingRevolution-Windows-x64.zip
          retention-days: 90

      - name: Publish direct Windows game download
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.5.2
          name: Pro Wrestling Revolution 0.5.2 - Metallic Chrome
          target_commitish: main
          prerelease: true
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          body: |
            Metallic gunmetal top bar and sidebar, with etched silver lines and cyan skin accents.
            Original red brand slash, four accessible vector utility buttons, and 200px sidebar.
            Brushed-metal selected menu row preserves the current New Game highlight.
            The original custom Backgrounds/Title_Screen.jpg remains untouched.
            No tagline, second logo, footer or additional art is imposed on custom skins.
            Skin browsing, MDB import, database editor, career copies and backups are unchanged.
            Updated Windows smoke checks cover the revised 200px sidebar and 36px top bar.
            Download the ZIP, extract into a writable folder and launch ProWrestlingRevolution.exe.
            Includes no third-party databases or images. Your own MDB is imported from Database Selector.
            Access table preview requires a matching Microsoft ACE OLE DB driver; direct file import/copy does not.
            The gameplay engine is not connected to the new MDB universe model yet.
          files: ProWrestlingRevolution-Windows-x64.zip
